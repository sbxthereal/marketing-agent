name: Validate worker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q pilot windows tools
  windows-server-2022:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_LOGGING_LEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install installer
        run: python -m pip install uv==0.13.7
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem windows\*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Install and run local browser tests
        shell: powershell
        run: .\windows\setup.ps1 -InstallChrome -RunTests
      - name: Check Browser Use import and task definition
        shell: powershell
        run: |
          & .\.venv\Scripts\python.exe -c "from browser_use import Agent, Browser; from pilot.agent_browser import agent_discover; print('OneAPI browser adapter imports on Windows')"
          if ($LASTEXITCODE -ne 0) { throw 'Browser Use import failed' }
          .\windows\install-task.ps1 -TaskName "MeDo-CI-$env:GITHUB_RUN_ID" -WhatIf
