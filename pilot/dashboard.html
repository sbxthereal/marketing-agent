<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeDo · Reddit pilot</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,sans-serif;color:#192d32;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}header{background:#102f33;color:#fff;padding:28px max(24px,calc((100vw - 1160px)/2))}header h1{font-size:28px;margin:3px 0 8px;font-weight:650}header p{margin:0;color:#cadbd8}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a6d3bf}main{max-width:1208px;margin:auto;padding:24px}button,select{font:inherit;border:1px solid #c6d1c8;border-radius:8px;padding:9px 13px;background:#fff;color:#183b34;cursor:pointer}button:hover{background:#edf5ef}button.primary{background:#1b6651;border-color:#1b6651;color:white}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #df971a;outline-offset:3px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.notice{border:1px solid #dfcb8b;background:#fff7dc;padding:12px 16px;border-radius:10px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:#fff;border:1px solid #dce1d9;border-radius:12px;padding:18px}.stat b{display:block;font-size:27px;line-height:1.2}.muted{color:#64716c;font-size:13px}.list{display:grid;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dce1d9;border-radius:12px;padding:20px}.card h2{font-size:19px;margin:0}.card p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0;color:#62706b;font-size:12px}.pill{border-radius:20px;background:#edf2ea;padding:3px 10px;color:#345c45}.review,.approved{background:#dceee4}.skipped,.rejected,.expired{background:#eceeeb;color:#69736c}.error{background:#ffe4de;color:#943c2e}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:12px}.label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#697c70}.draft{background:#f3f7f1;padding:14px;border-radius:8px;border-left:3px solid #60a581;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}a{color:#1b6651}footer{padding:30px 0;color:#64716c;font-size:12px}.empty{padding:40px;text-align:center;color:#64716c}#error{color:#943c2e}input{font:inherit;padding:9px;border:1px solid #c6d1c8;border-radius:8px;min-width:250px;max-width:100%}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}header{padding:24px}main{padding:16px}.card{padding:16px}}
</style></head><body><header><div class="eyebrow">MeDo / Growth experiments</div><h1>Reddit review desk</h1><p>Find a useful match. Review the evidence. Help someone solve a problem.</p></header>
<main><div class="bar"><div><strong id="mode">Connecting…</strong><div class="muted" id="model"></div></div><div><button id="refresh">Refresh</button> <button id="pause">Pause discovery</button></div></div>
<div class="notice" id="notice"></div><div role="status" id="error"></div>
<div class="stats"><div class="stat"><b id="reviews">0</b><span>Awaiting review</span></div><div class="stat"><b id="approved">0</b><span>Approved drafts</span></div><div class="stat"><b id="calls">0</b><span>Model calls today</span></div><div class="stat"><b id="tokens">0</b><span>Reported tokens today</span></div></div>
<div class="bar"><strong>Opportunities</strong><label>Show <select id="filter"><option value="all">All items</option><option value="review">Awaiting review</option><option value="approved">Approved</option><option value="skipped">Skipped</option><option value="error">Errors</option></select></label></div>
<div class="notice" id="efficiency"></div><div class="muted" id="pacing"></div><div class="list" id="items"></div><footer id="foot"></footer></main>
<script nonce="__NONCE__">
const token='__TOKEN__';let state,items=[];
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Pilot-Token':token},body:JSON.stringify(data)}:{});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function error(e){document.getElementById('error').textContent=e.message}
async function publish(x,retry=false){try{await api((retry?'/api/retry/':'/api/publish/')+encodeURIComponent(x.id),{draft_hash:x.draft_hash});await refresh()}catch(e){error(e)}}
async function act(id,action,url){try{await api('/api/review/'+encodeURIComponent(id),{action,publication_url:url||''});await refresh()}catch(e){error(e)}}
function render(){const box=document.getElementById('items');box.replaceChildren();const filter=document.getElementById('filter').value;const visible=items.filter(x=>filter==='all'||x.status===filter).sort((a,b)=>Number(b.status==='review'&&b.result?.decision==='recommend')-Number(a.status==='review'&&a.result?.decision==='recommend'));if(!visible.length)box.append(el('div','No items in this view.','empty'));for(const x of visible){const c=el('article',undefined,'card');c.append(el('h2',x.payload.title));const meta=el('div',undefined,'meta');meta.append(el('span',x.status,'pill '+x.status),el('span','r/'+x.payload.subreddit+' · '+x.payload.kind),el('span',new Date(x.created*1000).toLocaleString()));if(x.payload.discovery_source)meta.append(el('span',x.payload.discovery_source));meta.append(el('span','Priority '+(x.priority||0)));c.append(meta);const two=el('div',undefined,'two');const source=el('div');source.append(el('div','Source / evidence','label'),el('p',x.payload.body));if(x.payload.url&&state.source!=='demo'){const a=el('a','Open source to verify');a.href=x.payload.url;a.target='_blank';a.rel='noopener noreferrer';source.append(a)}const result=el('div');result.append(el('div','Review','label'));if(x.result){result.append(el('p',x.result.reason));if(x.result.evidence)result.append(el('p','Evidence: “'+x.result.evidence+'”','muted'));if(x.result.draft)result.append(el('div',x.result.draft,'draft'))}else result.append(el('p',x.error||'Waiting for analysis.','muted'));two.append(source,result);c.append(two);const actions=el('div',undefined,'actions');if(x.status==='review'&&x.result?.decision==='recommend'){const b=el('button','Approve draft','primary');b.onclick=()=>act(x.id,'approve');actions.append(b)}if(['review','approved'].includes(x.status)){const b=el('button','Reject');b.onclick=()=>act(x.id,'reject');actions.append(b)}if(x.status==='approved'&&x.result?.draft){const help=el('span',x.publication ? 'Publication: '+x.publication.state+(x.publication.error?' · '+x.publication.error:'') : 'Approved. Nothing has been sent.','muted');actions.append(help);if(state.publishing==='reviewed browser'&&x.publication?.state==='blocked'){const retry=el('button','Retry preflight');retry.onclick=()=>publish(x,true);actions.append(retry)}if(state.publishing==='reviewed browser'&&!x.publication){const send=el('button','Publish approved reply','primary');send.onclick=()=>publish(x);actions.append(send)}if(state.source!=='demo'&&!x.publication){const input=el('input');input.placeholder='Paste the Reddit publication URL';input.setAttribute('aria-label','Reddit publication URL');const b=el('button','Record manual publication (unverified)');b.onclick=()=>act(x.id,'published',input.value);actions.append(input,b)}}if(x.publication?.permalink){const link=el('a','View verified comment');link.href=x.publication.permalink;link.target='_blank';link.rel='noopener noreferrer';actions.append(link)}if(state.read_only_dashboard)actions.querySelectorAll('button,input').forEach(node=>node.remove());c.append(actions);box.append(c)}}
async function refresh(){try{[state,items]=await Promise.all([api('/api/status'),api('/api/items')]);document.getElementById('error').textContent='';document.getElementById('mode').textContent=(state.validation_snapshot?'Read-only validation snapshot':state.source==='demo'?'Synthetic demo':'Browser pilot')+' · '+(state.paused?'Paused':'Running');document.getElementById('model').textContent=state.ai==='fixture'?'Canned fixture results · no Reddit access or AI charges':state.model+' via Comate OneAPI';document.getElementById('notice').textContent=state.validation_snapshot?'These are real discussions captured for a bounded validation check. Continuous discovery is paused, and nothing has been published.':state.source==='demo'?'These are invented posts and templates. This demo does not access Reddit, publish content, or verify real MeDo features.':'Review each source and community rule before using a draft. Only reviewed drafts explicitly queued for publication can be sent. Discovery combines selected new-post feeds and rotating problem searches. Coverage gaps are reported below.';const eff=state.efficiency||{};document.getElementById('efficiency').textContent='Last 24 hours: '+(eff.scans||0)+' scans · '+(eff.pages||0)+' pages · '+(eff.new_items||0)+' new posts · '+(eff.duplicates||0)+' duplicates avoided. '+((eff.recent||[]).some(s=>s.state==='coverage_capped')?'A recent scan reached its page limit: coverage is partial.':'');const pace=state.pacing||{};document.getElementById('pacing').textContent='Reply limits: '+(pace.max_per_day||3)+'/24h total · '+((pace.interval_seconds||7200)/3600)+'h between replies · '+(pace.max_per_subreddit_day||2)+'/community/24h · '+((pace.subreddit_interval_seconds||21600)/3600)+'h community cooldown.'+(pace.next_global_at?' Next global slot: '+new Date(pace.next_global_at*1000).toLocaleString()+'.':'')+' Additional author and duplicate checks apply.';document.getElementById('reviews').textContent=state.counts.review||0;document.getElementById('approved').textContent=state.counts.approved||0;document.getElementById('calls').textContent=state.usage.calls+' / '+state.max_daily_calls;document.getElementById('tokens').textContent=(state.usage.input_tokens+state.usage.output_tokens).toLocaleString();document.getElementById('pause').hidden=state.read_only_dashboard;if(state.read_only_dashboard)document.getElementById('notice').textContent='Company dashboard · read-only. Review and publishing controls are available inside the Windows server at http://127.0.0.1:'+location.port+'. '+document.getElementById('notice').textContent;document.getElementById('pause').textContent=state.paused?'Resume discovery':'Pause discovery';document.getElementById('foot').textContent='Daily budgets reset at 00:00 UTC. '+state.usage.budget_tokens+' / '+state.max_daily_tokens+' tokens counted against budget (includes reservations for unknown usage). '+(state.message||'')+' USD cost is unavailable until gateway billing rates are supplied.';render()}catch(e){error(e)}}
document.getElementById('refresh').onclick=refresh;document.getElementById('filter').onchange=render;document.getElementById('pause').onclick=async()=>{try{await api('/api/control',{action:state.paused?'resume':'pause'});await refresh()}catch(e){error(e)}};refresh();setInterval(refresh,15000);
</script></body></html>
